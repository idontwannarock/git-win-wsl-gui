name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the current stable Rust
        run: rustup update stable
      - name: Check that the tag matches the app version
        run: |
          $match = Select-String -Path crates/app/Cargo.toml -Pattern '^version = "(.*)"'
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match crates/app/Cargo.toml version $version"
          }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Package
        run: |
          $name = "git-win-wsl-gui-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/app.exe "$name/git-win-wsl-gui.exe"
          Copy-Item README.md, LICENSE $name
          Copy-Item crates/app/assets/fonts/OFL-*.txt $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content -Encoding ascii "$name.zip.sha256"
          "ASSET=$name.zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME $env:ASSET "$env:ASSET.sha256" --title $env:GITHUB_REF_NAME --generate-notes
